<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quản lý dự án NCKH</title>
  <!-- Thư viện CDN, ghi rõ phiên bản -->
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
  <style>
    :root {
      --bg: #f6f7f9; --surface: #fff; --text: #1f2328; --muted: #667085; --line: #e3e6ea; --hover: #f1f3f5; --accent: #2563eb;
      /* màu trạng thái — dùng chung cho mọi màn hình */
      --gray: #8b939e; --gray-bg: #eef0f2;
      --blue: #2563eb; --blue-bg: #e7efff;
      --red: #d92d20; --red-bg: #fdecea;
      --green: #16a34a; --green-bg: #e6f6ec;
      --amber: #c27803; --amber-bg: #fdf2dc;
      --violet: #7c3aed; --violet-bg: #f0eaff;
      --muted-c: #a3a9b1; --muted-bg: #f3f4f5;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--text); font: 14.5px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    a { color: var(--accent); text-decoration: none; }
    button, input, select, textarea { font: inherit; color: inherit; }
    input, select, textarea { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; }
    input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }
    textarea { width: 100%; resize: vertical; line-height: 1.5; }
    .hidden { display: none !important; }
    .muted { color: var(--muted); }
    .small { font-size: 12.5px; }
    .id { font-family: ui-monospace, Consolas, monospace; font-size: 12px; color: var(--muted); white-space: nowrap; }
    .btn { padding: 5px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); cursor: pointer; white-space: nowrap; }
    .btn:hover { background: var(--hover); }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn.danger { color: var(--red); }
    .btn.sm { padding: 2px 8px; font-size: 12.5px; }
    .btn:disabled { opacity: .5; cursor: default; }
    .link { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; font-size: 13px; }

    /* trạng thái */
    .st { display: inline-flex; align-items: center; gap: 5px; padding: 1px 8px; border-radius: 10px; font-size: 12px; white-space: nowrap; background: var(--cb); color: var(--c); }
    .st::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--c); }
    .c-gray { --c: var(--gray); --cb: var(--gray-bg); } .c-blue { --c: var(--blue); --cb: var(--blue-bg); }
    .c-red { --c: var(--red); --cb: var(--red-bg); } .c-green { --c: var(--green); --cb: var(--green-bg); }
    .c-amber { --c: var(--amber); --cb: var(--amber-bg); } .c-violet { --c: var(--violet); --cb: var(--violet-bg); }
    .c-muted { --c: var(--muted-c); --cb: var(--muted-bg); }

    /* khung */
    header { position: sticky; top: 0; z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
    .bar { display: flex; align-items: center; gap: 14px; padding: 0 16px; height: 50px; max-width: 1280px; margin: 0 auto; }
    .brand { font-weight: 600; white-space: nowrap; }
    nav { display: flex; gap: 2px; overflow-x: auto; flex: 1; min-width: 0; }
    nav a { padding: 5px 11px; border-radius: 6px; color: var(--muted); white-space: nowrap; }
    nav a:hover { background: var(--hover); color: var(--text); }
    nav a.on { background: var(--hover); color: var(--text); font-weight: 500; }
    .gitbox { display: flex; align-items: center; gap: 6px; font-size: 12.5px; white-space: nowrap; }
    .gitbox .info { color: var(--muted); }
    .gitbox .info.warn { color: var(--amber); }
    main { max-width: 1280px; margin: 0 auto; padding: 18px 16px 60px; }
    h1 { font-size: 19px; margin: 0 0 14px; font-weight: 600; }
    h2 { font-size: 15px; margin: 0 0 10px; font-weight: 600; }
    .card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; margin-bottom: 14px; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 14px; }
    .kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; }
    .kpi b { display: block; font-size: 24px; font-weight: 600; line-height: 1.2; }
    .kpi span { color: var(--muted); font-size: 13px; }
    .toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
    .toolbar .right { margin-left: auto; display: flex; gap: 8px; align-items: center; }
    .toolbar select { max-width: 240px; }
    .toolbar input[type=search] { width: 160px; }
    .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
    .seg button { border: 0; background: var(--surface); padding: 4px 12px; cursor: pointer; }
    .seg button.on { background: var(--hover); font-weight: 500; }
    .legend { display: flex; flex-wrap: wrap; gap: 6px; }

    /* thanh tiến độ xếp chồng */
    .stack { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: var(--hover); }
    .stack span { background: var(--c); }
    .phase { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(120px, 1fr) auto; gap: 12px; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--line); }
    .phase:last-child { border-bottom: 0; }

    /* bảng */
    table.t { width: 100%; border-collapse: collapse; background: var(--surface); }
    table.t th { text-align: left; font-weight: 500; font-size: 12.5px; color: var(--muted); padding: 7px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
    table.t th.sort { cursor: pointer; }
    table.t td { padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
    table.t tr.click { cursor: pointer; }
    table.t tr.click:hover td { background: var(--hover); }
    table.t tr.best td { background: var(--green-bg); }
    .tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
    .num { font-variant-numeric: tabular-nums; text-align: right; }

    /* kanban */
    .kanban { display: grid; grid-template-columns: repeat(5, minmax(200px, 1fr)); gap: 10px; overflow-x: auto; align-items: start; }
    .col { background: var(--hover); border-radius: 8px; padding: 8px; min-height: 120px; }
    .col.drop { outline: 2px dashed var(--accent); }
    .col h3 { margin: 2px 4px 8px; font-size: 13px; display: flex; gap: 6px; align-items: center; }
    .kc { background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--c); border-radius: 6px; padding: 7px 9px; margin-bottom: 7px; cursor: pointer; }
    .kc:hover { border-color: var(--accent); }
    .kc .meta { display: flex; gap: 6px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-top: 3px; }
    .kc.c-muted .tt { text-decoration: line-through; color: var(--muted); }

    /* tài liệu nghiệp vụ */
    .doc { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 18px; align-items: start; }
    .toc { position: sticky; top: 66px; font-size: 13px; max-height: calc(100vh - 80px); overflow: auto; }
    .toc a { display: block; padding: 3px 6px; color: var(--muted); border-radius: 4px; }
    .toc a:hover { background: var(--hover); color: var(--text); }
    .toc .grp { font-weight: 600; color: var(--text); margin-top: 8px; }
    .blk-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 6px; }
    .blk-head h2 { margin: 0; }
    .blk-head .acts { margin-left: auto; display: flex; gap: 10px; }
    .attrs { display: grid; grid-template-columns: max-content 1fr; gap: 3px 12px; font-size: 13.5px; margin: 4px 0 8px; }
    .attrs dt { color: var(--muted); }
    .attrs dd { margin: 0; }

    /* markdown */
    .md { overflow-wrap: anywhere; }
    .md > :first-child { margin-top: 0; } .md > :last-child { margin-bottom: 0; }
    .md p, .md ul, .md ol, .md table { margin: 0 0 .6em; }
    .md ul, .md ol { padding-left: 20px; }
    .md h4, .md h5 { margin: .8em 0 .3em; font-size: 14px; }
    .md table { border-collapse: collapse; font-size: 13px; display: block; overflow-x: auto; }
    .md th, .md td { border: 1px solid var(--line); padding: 4px 8px; text-align: left; }
    .md code { background: var(--hover); padding: 0 4px; border-radius: 3px; font-size: 12.5px; }

    /* nhật ký */
    .logs { margin-top: 8px; border-top: 1px dashed var(--line); padding-top: 8px; }
    .log { font-size: 13px; padding: 3px 0; display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; }
    .log .who { font-weight: 600; }
    .kind { font-size: 11.5px; padding: 0 6px; border-radius: 8px; background: var(--hover); color: var(--muted); }
    .kind.k-ketqua { background: var(--green-bg); color: var(--green); }
    .kind.k-vuongmac { background: var(--red-bg); color: var(--red); }
    .kind.k-dexuat { background: var(--amber-bg); color: var(--amber); }
    .addlog { display: flex; gap: 6px; margin-top: 6px; }
    .addlog input { flex: 1; min-width: 0; }

    /* ngăn chi tiết */
    .drawer-bg { position: fixed; inset: 0; background: rgba(0,0,0,.25); z-index: 30; }
    .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(600px, 100vw); background: var(--surface); z-index: 31; overflow: auto; padding: 16px 18px 40px; box-shadow: -6px 0 24px rgba(0,0,0,.12); }
    .drawer .title { width: 100%; font-size: 17px; font-weight: 600; border: 1px solid transparent; padding: 3px 6px; margin-left: -7px; }
    .drawer .title:hover { border-color: var(--line); }
    .form { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 7px 10px; align-items: center; margin: 10px 0 14px; }
    .form label { color: var(--muted); font-size: 13px; }
    .form input, .form select { width: 100%; }
    .section-title { font-size: 12.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin: 14px 0 6px; }

    /* pipeline */
    .mermaid-box { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px; overflow-x: auto; margin-bottom: 14px; }
    .mermaid-box .node { cursor: pointer; }
    .mini { list-style: none; margin: 0; padding: 0; }
    .mini li { display: flex; gap: 8px; align-items: baseline; padding: 6px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
    .mini li:last-child { border-bottom: 0; }
    .mini li:hover .nm { color: var(--accent); }
    .mini .nm { flex: 1; min-width: 0; }

    .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 40; display: flex; align-items: center; justify-content: center; padding: 16px; }
    .modal { background: var(--surface); border-radius: 10px; padding: 18px 20px; width: 100%; max-width: 480px; max-height: 90vh; overflow: auto; }
    .modal.wide { max-width: 980px; }
    .modal pre { background: var(--hover); padding: 8px; border-radius: 6px; font-size: 12px; white-space: pre-wrap; max-height: 40vh; overflow: auto; }
    .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; align-items: center; }
    .actions .left { margin-right: auto; }
    .hunk { border: 1px solid var(--line); border-radius: 8px; margin-bottom: 12px; overflow: hidden; }
    .hunk .hh { background: var(--hover); padding: 6px 10px; font-size: 13px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .hunk .sides { display: grid; grid-template-columns: 1fr 1fr; }
    .hunk pre { margin: 0; border-radius: 0; max-height: 220px; }
    .hunk .sides > div:first-child pre { border-right: 1px solid var(--line); }
    .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--text); color: #fff; padding: 7px 14px; border-radius: 6px; z-index: 50; font-size: 13.5px; max-width: 90vw; }
    .toast.err { background: var(--red); }
    .banner { background: var(--amber-bg); color: var(--amber); padding: 8px 12px; border-radius: 8px; margin-bottom: 12px; display: flex; gap: 10px; align-items: center; }

    @media (max-width: 1100px) {
      .kpis { grid-template-columns: repeat(2, 1fr); }
      .doc { grid-template-columns: 1fr; }
      .toc { display: none; }
    }
    @media (max-width: 820px) {
      .grid2 { grid-template-columns: 1fr; }
      .bar { flex-wrap: wrap; height: auto; padding: 8px 12px; gap: 6px 12px; }
      nav { order: 3; flex-basis: 100%; }
      .form { grid-template-columns: 1fr; }
      .hunk .sides { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <div class="bar">
      <span class="brand">Quản lý dự án NCKH</span>
      <nav id="nav">
        <a href="#tong-quan">Tổng quan</a>
        <a href="#nghiep-vu">Nghiệp vụ</a>
        <a href="#dau-viec">Đầu việc</a>
        <a href="#pipeline">Pipeline</a>
        <a href="#model">Model &amp; thí nghiệm</a>
      </nav>
      <div class="gitbox">
        <span id="gitInfo" class="info"></span>
        <button class="btn sm" id="pullBtn" title="git pull">Pull</button>
        <button class="btn sm primary" id="pushBtn" title="Commit PROJECT.md, pull rồi push">Commit &amp; Push</button>
        <select id="userSel" title="Bạn là ai"><option value="">Chọn người…</option><option>Nam</option><option>Lâm</option></select>
      </div>
    </div>
  </header>
  <main id="main"><p class="muted">Đang tải…</p></main>
  <div id="layer"></div>
  <script src="/app.js"></script>
</body>
</html>
