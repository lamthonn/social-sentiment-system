<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quản lý đề tài</title>
  <link rel="stylesheet" href="/style.css">
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <a class="brand" href="#/">Quản lý đề tài</a>
      <nav id="tabs" class="tabs"></nav>
      <div class="header-right">
        <form id="searchForm"><input id="searchInput" type="search" placeholder="Tìm…"></form>
        <button id="syncBtn" class="btn" title="Lấy thay đổi của người khác và đẩy thay đổi của bạn lên git">Đồng bộ<span id="syncInfo" class="sync-info"></span></button>
        <button id="userBtn" class="link-btn" title="Đổi tên"></button>
      </div>
    </div>
  </header>
  <main id="main" class="main"><p class="muted">Đang tải…</p></main>
  <div id="modal" class="modal hidden" role="dialog" aria-modal="true"><div class="modal-box" id="modalBox"></div></div>
  <div id="toast" class="toast hidden"></div>
  <script src="/app.js"></script>
</body>
</html>
